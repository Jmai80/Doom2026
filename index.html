<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doom2026</title>
  <link rel="icon" type="image/x-icon" href="./assets/doom.ico">
  <link rel="stylesheet" href="style.css">
  <!-- Phaser laddas som ett vanligt skript (globalt) innan modulerna körs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div><b>↑</b>/<b>↓</b> framåt &amp; bak &nbsp;&nbsp; <b>←</b>/<b>→</b> vrid &nbsp;&nbsp; <b>Q</b>/<b>E</b> sidled &nbsp;&nbsp; <b>SPACE</b> skjut</div>
    <div style="opacity:0.45">W / A / S / D fungerar också</div>
  </div>

  <!-- Pekkontroller — visas bara på touchskärmar (styrs av style.css) -->
  <div id="touch-controls">
    <div id="joystick" aria-label="Styrplatta">
      <div id="joy-knob"></div>
    </div>
    <button id="btn-fire" class="tbtn" aria-label="Skjut">FIRE</button>
  </div>

  <!-- Vinstskärmens topplista — döljs/visas av js/highscore.js -->
  <div id="hs-panel" hidden>
    <div id="hs-title">ALLA BANOR KLARA!</div>
    <div id="hs-time"></div>
    <div id="hs-entry">
      <input id="hs-name" maxlength="12" placeholder="DITT NAMN"
             autocomplete="off" autocapitalize="characters">
      <div id="hs-entry-buttons">
        <button id="hs-submit">SKICKA</button>
        <button id="hs-skip">HOPPA ÖVER</button>
      </div>
    </div>
    <ol id="hs-list"></ol>
    <div id="hs-status"></div>
    <div id="hs-restart-hint" hidden>MELLANSLAG / FIRE = SPELA IGEN</div>
  </div>

  <!-- type="module" aktiverar ES-moduler; Phaser-global är redan laddad -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
